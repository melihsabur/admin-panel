version: '3.8'

services:
  # PostgreSQL Veritabani
  postgres:
    image: postgres:15-alpine
    container_name: admin_panel_postgres
    environment:
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_pass_2024
      POSTGRES_DB: admin_panel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/triggers.sql:/docker-entrypoint-initdb.d/02-triggers.sql
      - ./database/functions.sql:/docker-entrypoint-initdb.d/03-functions.sql
      - ./database/procedures.sql:/docker-entrypoint-initdb.d/04-procedures.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin_user -d admin_panel_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: admin_panel_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  # RabbitMQ Mesaj Kuyrugu
  rabbitmq:
    image: rabbitmq:3-management
    container_name: admin_panel_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq_user
      RABBITMQ_DEFAULT_PASS: rabbitmq_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - app_network

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: admin_panel_backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  # Log Servisi (RabbitMQ Consumer)
  log_service:
    build: ./services/log_service
    container_name: admin_panel_log_service
    environment:
      RABBITMQ_URL: amqp://rabbitmq_user:rabbitmq_pass@rabbitmq:5672/
      DB_HOST: postgres
      POSTGRES_DB: admin_panel_db
      POSTGRES_USER: admin_user
      POSTGRES_PASSWORD: admin_pass_2024
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  # Dosya Servisi (RabbitMQ Consumer)
  file_service:
    build: ./services/file_service
    container_name: admin_panel_file_service
    environment:
      RABBITMQ_URL: amqp://rabbitmq_user:rabbitmq_pass@rabbitmq:5672/
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  # AI Servisi (RabbitMQ Consumer)
  ai_service:
    build: ./services/ai_service
    container_name: admin_panel_ai_service
    environment:
      RABBITMQ_URL: amqp://rabbitmq_user:rabbitmq_pass@rabbitmq:5672/
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app_network

  # React Frontend
  frontend:
    build: ./frontend
    container_name: admin_panel_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  uploads_data:

networks:
  app_network:
    driver: bridge
